
server.port=8090
# Spring Datasource (using SQLite)
# The database file will be created in the project's root directory
spring.datasource.url=jdbc:sqlite:vibe.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
#spring.flyway.baseline-on-migrate=true
# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Let Flyway manage the schema. Disable Hibernate's DDL generation/validation.
spring.jpa.hibernate.ddl-auto=none

# JWT Secret - IMPORTANT: Use a strong, securely stored secret in production!
jwt.secret=ThisIsAStrongAndSecureSecretKeyForJWTThatIsLongerThan512BitsForHS512
# Set the default log level for all libraries to INFO
logging.level.root=INFO

# Set a more detailed log level for your application's code
logging.level.com.talentEvaluation=DEBUG

# Reduce noise from verbose libraries
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Configure logging to a file
logging.file.name=logs/talent-evaluation.log

